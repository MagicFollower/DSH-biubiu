{{- $scope := .scope | default (printf "landing-%s" (md5 (printf "%v" .item))) -}}
{{- $page := .page -}}{{- $data := .data -}}{{- $item := .item -}}
<figure class="td-landing-testimonial{{ with $item.class }} {{ . }}{{ end }}">
  {{- with ($item.comment | default $item.quote) }}<blockquote>{{ partial "landing/markdown-block.html" (dict "page" $page "scope" (printf "%s-testimonial-field-1" $scope) "value" .) }}</blockquote>{{ end }}
  <figcaption>
    {{- if or $item.image $item.logo $item.icon }}<div class="td-landing-testimonial__avatar">{{ partial "landing/media.html" (dict "page" $page "item" $item) }}</div>{{ end }}
    <div>{{ with ($item.name | default $item.title) }}<strong>{{ partial "landing/markdown.html" (dict "page" $page "scope" (printf "%s-testimonial-field-2" $scope) "value" .) }}</strong>{{ end }}{{ with ($item.desc | default $item.role) }}<span>{{ partial "landing/markdown.html" (dict "page" $page "scope" (printf "%s-testimonial-field-3" $scope) "value" .) }}</span>{{ end }}</div>
    {{- partial "landing/action.html" (dict "page" $page "scope" $scope "item" $item "label" ($item.source | default $data.link_label)) }}
  </figcaption>
</figure>
