# DeepSeek Harness 文档站配置 —— 由 replicate-doc-site 技能生成的骨架
# 全部占位已替换，判据是 scaffold.py 报 placeholders_remaining=0。
title: &siteTitle DeepSeek Harness 文档站 # 站点标题（浏览器标签、顶栏、页脚）
baseURL: https://dsh-docs.local/ # 站点 canonical URL（本站可离线打开，此值仅作 SEO 缺省）
relativeURLs: true # 相对链接：构建产物可直接从磁盘路径打开，也可挂任意子路径
defaultContentLanguage: zh
enableGitInfo: false
  # 说明：enableGitInfo 从 Git 提交记录读每页最后修改时间。
  # 本站未纳入 Git，保持 false，否则会因 dubious ownership 等报错中断构建。
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: 围绕 DeepSeek Harness 的中文文档站：DeepSeek 发展历程与模型时间线、终端 Agent 工具演进，到 DSH 的架构、CLI、Web GUI 与插件生态。

# OINK 的 Markdown 组件依赖这三项 Goldmark 设置，删掉会让 callout/图表失效。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

# markdown 输出让每页额外产出可下载的 .md；print 供整站打印档。
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: DeepSeek Harness 文档站贡献者
    from_year: 2026
  footer_center_info: '内容按主题组织：DeepSeek 模型史 · 终端 Agent 工具 · DeepSeek Harness（DSH）指南'
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_expand_levels: 4
    sidebar_icon_policy: groups
    backlinks: true
    # theme_color: '#245f94'
    # typography: system
    # image_zoom: true
    # share: [mastodon, linkedin, email, copy]
    # feedback: { enable: true, reasons: true }
    # 视觉预设（OINK 1.2+）：读者在页面 Appearance 面板一键切换，选择写入
    # localStorage 跨页记住、首帧前应用无闪烁。`preset` 是站点默认观感，必须出现在
    # `preset_menu` 里（漏了主题会 warn 并自动补上）。明暗切换由上面的 `dark_mode` 单独管。
    # 想要单一外观：把 preset_menu 改成 false（只留 preset）或缩成 [paper]。
    # OINK <1.2 的主题副本没有这套体系，配了也不生效——先确认 assets/theme 副本里有
    # assets/scss/td/_presets.scss 与 layouts/_partials/preset-config.html。
    preset: paper                              # 默认观感；要 1.0/1.1 的技术风改成 slate
    preset_menu: [paper, slate, ink, terminal] # 本技能的默认交付：4 套全开
  # github_repo: https://github.com/OWNER/REPOSITORY
  # github_branch: main
  # logo: icons/logo.svg
  # wordmark: icons/wordmark.svg

module:
  imports:
    - path: github.com/pgsty/oink
      replacement: ./oink-main/oink-main
  hugoVersion:
    extended: true
    min: 0.166.0
