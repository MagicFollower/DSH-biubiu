      url: docs/01-deepseek/
    - title: 终端 Agent 工具演进
      desc: Codex CLI、Gemini CLI、Claude Code 三巨头，OpenClaw 现象与 MCP/ACP 互操作协议。
      icon: fa-solid fa-terminal
      url: docs/02-agent-tools/
    - title: DeepSeek Harness 指南
      desc: DSH 的 profile 架构、dsh CLI 参考、Web GUI 环境全景与 providers-hub 插件实战。
      icon: fa-solid fa-rocket
      url: docs/03-dsh/
    - title: DSH 本机实操教程
      desc: 2026-10-24 实测：Node/DSH 安装启动、配置与插件、Jet Hub、排障验收与升级回滚。
      icon: fa-solid fa-screwdriver-wrench
      url: docs/04-hands-on/

